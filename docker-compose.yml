services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pkmcenter
      POSTGRES_USER: pkm
      POSTGRES_PASSWORD: pkm_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkm -d pkmcenter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://pkm:pkm_dev_password@db:5432/pkmcenter?sslmode=disable
      JWT_SECRET: change-this-before-production
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_URL: http://localhost:8081/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
