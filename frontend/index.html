        <h1>PKM Center Unila — Pusat Kreativitas Mahasiswa Universitas Lampung</h1>
        <p>
          Selamat datang di portal resmi <strong>PKM Center Unila</strong> (<strong>PKM Unila</strong> /
          <strong>PKM Center Lampung</strong>), pusat informasi, pendampingan, dan digitalisasi manajemen
          <strong>Program Kreativitas Mahasiswa (PKM) Universitas Lampung</strong>.
        </p>
        <h2>Layanan Utama PKM Center Unila</h2>
        <ul>
          <li><strong>PKMATE AI &amp; Idea Lab:</strong> Analisis kebaruan ide, rekomendasi skema PKM, dan cek format proposal.</li>
          <li><strong>Kolaborasi Tim Multidisiplin:</strong> Cari rekan mahasiswa dari 8 fakultas di Universitas Lampung dan dosen pembimbing.</li>
          <li><strong>Seleksi &amp; Review Internal PKM Unila:</strong> Pengajuan proposal, logbook kegiatan, dan penilaian reviewer menuju PIMNAS.</li>
          <li><strong>Panduan Resmi SIMBELMAWA:</strong> Pedoman 10 skema PKM (PKM-RE, PKM-RSH, PKM-K, PKM-PM, PKM-PI, PKM-KC, PKM-KI, PKM-VGK, PKM-GFT, PKM-AI).</li>
        </ul>
        <p>
          Alamat: Gedung Rektorat Unila, Jl. Prof. Dr. Soemantri Brojonegoro No. 1, Gedong Meneng, Bandar Lampung 35145.
          Email: pkmcenter@unila.ac.id
        </p>
